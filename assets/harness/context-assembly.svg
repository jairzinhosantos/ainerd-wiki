<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="665" viewBox="0 0 1120 665" role="img" aria-labelledby="title desc">
<title id="title">Ensamblaje de contexto</title><desc id="desc">Cuatro fuentes alimentan selección, transformación y ensamblaje. El resultado es el contexto de una llamada al modelo. La memoria aporta información seleccionada; no se envía completa.</desc>
