oke="#62598d" stroke-width="1.5"/><text x="252.0" y="282" font-size="21" fill="#62598d" font-weight="650" text-anchor="middle">Seleccionar</text><text x="252.0" y="309" font-size="17" fill="#546e75" font-weight="400" text-anchor="middle">Relevancia y vigencia</text><path d="M 392 295 H 415" fill="none" stroke="#a9bdc2" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="418" y="250" width="280" height="90" rx="12" fill="#ffffff" stroke="#62598d" stroke-width="1.5"/><text x="558.0" y="282" font-size="21" fill="#62598d" font-weight="650" text-anchor="middle">Transformar</text><text x="558.0" y="309" font-size="17" fill="#546e75" font-weight="400" text-anchor="middle">Filtrar, resumir, recortar</text><path d="M 698 295 H 721" fill="none" stroke="#a9bdc2" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="724" y="250" width="280" height="90" rx="12" fill="#ffffff" stroke="#62598d" stroke-width="1.5"/><text x="864.0" y="282" font-size="21" fill="#62598d" font-weight="650" text-anchor="middle">Ensamblar</text><text x="864.0" y="309" font-size="17" fill="#546e75" font-weight="400" text-anchor="middle">Roles, orden y presupuesto</text><path d="M 1004 295 H 1075 V 417 H 700" fill="none" stroke="#a9bdc2" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="420" y="373" width="280" height="90" rx="12" fill="#ffffff" stroke="#13776e" stroke-width="1.5"/><text x="560.0" y="405" font-size="21" fill="#13776e" font-weight="650" text-anchor="middle">Contexto de la llamada</text><text x="560.0" y="432" font-size="17" fill="#546e75" font-weight="400" text-anchor="middle">Entrada seleccionada</text><path d="M 560 463 V 497" fill="none" stroke="#a9bdc2" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="420" y="508" width="280" height="90" rx="12" fill="#fff5ec" stroke="#b65a28" stroke-width="1.5"/><text x="560.0" y="540" font-size="21" fill="#b65a28" font-weight="650" text-anchor="middle">Modelo</text><text x="560.0" y="567" font-size="17" fill="#546e75" font-weight="400" text-anchor="middle">Siguiente inferencia</text><text x="560" y="636" font-size="18" fill="#546e75" font-weight="400" text-anchor="middle">El ensamblaje se repite cuando cambian la tarea o sus observaciones.</text></g></svg>