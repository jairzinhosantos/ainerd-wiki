<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="448" viewBox="0 0 1120 448" role="img" aria-labelledby="title desc">
<title id="title">Agentes de código y agentes empresariales</title><desc id="desc">Comparación de escenarios, sin capacidades exclusivas: ambos necesitan políticas, estado, ejecución y evaluación. El grado de autonomía depende de la tarea.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#a9bdc2"/></marker></defs>
<rect width="1120" height="448" rx="18" fill="#f8faf9"/>
<g font-family="Inter, system-ui, sans-serif"><text x="560" y="43" font-size="23" fill="#203b43" font-weight="650" text-anchor="middle">Dos escenarios · responsabilidades compartidas</text><rect x="30" y="78" width="324" height="295" rx="14" fill="white" stroke="#13776e" stroke-width="1.5"/><text x="192" y="120" font-size="22" fill="#13776e" font-weight="650" text-anchor="middle">Agentes de código</text><text x="192" y="173" font-size="17" fill="#203b43" font-weight="400" text-anchor="middle">Repositorio, editor y terminal</text><text x="192" y="221" font-size="17" fill="#203b43" font-weight="400" text-anchor="middle">Diffs, pruebas y dependencias</text><text x="192" y="269" font-size="17" fill="#203b43" font-weight="400" text-anchor="middle">Permisos sobre el workspace</text><text x="192" y="317" font-size="17" fill="#203b43" font-weight="400" text-anchor="middle">Entrega de cambios revisables</text><rect x="398" y="78" width="324" height="295" rx="14" fill="white" stroke="#b65a28" stroke-width="1.5"/><text x="560" y="120" font-size="22" fill="#b65a28" font-weight="650" text-anchor="middle">En común</text><text x="560" y="173" font-size="17" fill="#203b43" font-weight="400" text-anchor="middle">Modelo y contexto</text><text x="560" y="221" font-size="17" fill="#203b43" font-weight="400" text-anchor="middle">Memoria y estado</text><text x="560" y="269" font-size="17" fill="#203b43" font-weight="400" text-anchor="middle">Herramientas y políticas</text><text x="560" y="317" font-size="17" fill="#203b43" font-weight="400" text-anchor="middle">Runtime, trazas y evaluación</text><rect x="766" y="78" width="324" height="295" rx="14" fill="white" stroke="#62598d" stroke-width="1.5"/><text x="928" y="120" font-size="22" fill="#62598d" font-weight="650" text-anchor="middle">Agentes empresariales</text><text x="928" y="173" font-size="17" fill="#203b43" font-weight="400" text-anchor="middle">Canales, APIs y datos</text><text x="928" y="221" font-size="17" fill="#203b43" font-weight="400" text-anchor="middle">Identidad y reglas del proceso</text><text x="928" y="269" font-size="17" fill="#203b43" font-weight="400" text-anchor="middle">Efectos en sistemas externos</text><text x="928" y="317" font-size="17" fill="#203b43" font-weight="400" text-anchor="middle">Seguimiento de operaciones</text><text x="560" y="415" font-size="18" fill="#546e75" font-weight="400" text-anchor="middle">La autonomía, el riesgo y la revisión humana se definen por tarea.</text></g></svg>